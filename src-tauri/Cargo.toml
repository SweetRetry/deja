[package]
name = "shelf"
version = "0.1.0"
description = "Folder-first asset browser"
edition = "2021"
rust-version = "1.77"
default-run = "shelf"

[lib]
name = "shelf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "shelf-e2e"
path = "src/bin/e2e_server.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
miniz_oxide = "0.8"
notify = "7"
sqlite-vec = "0.1.9"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tauri-plugin-dialog = "2.0.0-rc.8"
