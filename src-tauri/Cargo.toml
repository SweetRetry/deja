[package]
name = "deja"
version = "0.1.0"
description = "Folder-first asset browser"
edition = "2021"
rust-version = "1.77"
default-run = "deja"

[lib]
name = "deja_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "deja-e2e"
path = "src/bin/e2e_server.rs"
# Test-only backend; off by default so release bundles skip it.
required-features = ["e2e"]

[features]
e2e = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
miniz_oxide = "0.8"
notify = "7"
sqlite-vec = "0.1.9"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tauri-plugin-dialog = "2.0.0-rc.8"
trash = "5"
